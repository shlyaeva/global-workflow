experiment:
  net: gfs
  mode: cycled
  pslot: {{ 'pslot' | getenv }}
  app: S2SW
  resdetatmos: 48
  resdetocean: 5.0
  comroot: {{ 'RUNTESTS' | getenv }}/COMROOT
  expdir: {{ 'RUNTESTS' | getenv }}/EXPDIR
  icsdir: {{ BASE_IC }}/C48mx500/20250808
  idate: 2021032418
  edate: 2021032500
  nens: 0
  interval: 6
  start: warm
  yaml: {{ HOMEglobal }}/dev/ci/cases/yamls/soca_ijedi_defaults_ci.yaml

# i-jedi (JEDI_MARINE_INTERFACE=ijedi) requires GDASApp built with BUILD_IJEDI=ON,
# which is not part of the default build yet; skip everywhere until staged.
skip_ci_on_hosts:
  - wcoss2
  - hera
  - ursa
  - orion
  - hercules
  - gaeac6
  - derecho
  - awsepicglobalworkflow

workflow:
  engine: rocoto
  rocoto:
    maxtries: 2
    cyclethrottle: 3
    taskthrottle: 25
    verbosity: 2
